name: Rebuild Merchant Center feed
on:
  schedule:
    - cron: "0 10 * * *"      # daily 10:00 UTC = 6 AM ET
    - cron: "30 12 * * *"     # backup run 8:30 AM ET in case the first cron is skipped
    - cron: "30 14 * * 4"     # Thursdays 10:30 AM ET: fresh week for the noon menu email
    # The site rolls to the new menu week at Wed midnight ET and the planner hides until this feed matches (found 11/19:
    # dark midnight-6:45 AM). Hourly tries 04:05-09:05 UTC Thursday = 11:05 PM Wed-4:05 AM ET in winter, 12:05-5:05 AM in
    # summer, since GitHub often runs scheduled jobs late. A run with nothing new commits nothing.
    - cron: "5 4-9 * * 4"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build feed from live site
        run: python build_merchant_feed.py --out docs
      - name: Commit if changed
        run: |
          git config user.name "tsk-feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/products.tsv docs/products.xml docs/products.json docs/feed_report.md
          git diff --cached --quiet && echo "no change" || (git commit -m "feed: $(date -u +%F)" && git push)
