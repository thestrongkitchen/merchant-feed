name: Rebuild Merchant Center feed
on:
  schedule:
    - cron: "0 10 * * *"      # daily 10:00 UTC = 6 AM ET (menu rotates Thursday; daily keeps prices fresh)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build feed from live site
        run: python build_merchant_feed.py --out docs
      - name: Commit if changed
        run: |
          git config user.name "tsk-feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/products.tsv docs/feed_report.md
          git diff --cached --quiet && echo "no change" || (git commit -m "feed: $(date -u +%F)" && git push)
